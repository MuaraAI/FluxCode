[package]
# No version while FluxCode is in development: each build is named
# BuildDev-YYYY-MM-DD-HH-MM-SS (see build.rs).
name = "fluxcode"
description = "FluxCode: a lightweight native code editor with an AI agent panel"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/MuaraAI/FluxCode"
publish = false

[[bin]]
name = "fluxcode"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
# Syntax colors from syntect with bat's grammar set: about 200 languages in a few MB,
# where tree-sitter needs a compiled grammar (often 1-3 MB) per language.
gpui-kit = { version = "=0.9.0", default-features = false, features = ["component", "assets", "syntect"] }
anyhow = "1"
futures = "0.3"
lsp-types = { version = "0.97", features = ["proposed"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only to read an image's width/height for the image tab; gpui already builds this
# crate with its decoders, so no new code is compiled.
image = { version = "0.25", default-features = false }
# Agent memory (AoC Memory port): ids are SHA-1 prefixes, times ISO 8601, as in
# ant_memory.py. Both crates are already compiled for gpui.
sha1_smol = "1"
# Attachments: images as base64, Word/Excel/PowerPoint text from their ZIP (already compiled for gpui);
# miniz_oxide also packs a large Flux document's text.
base64 = "0.22"
miniz_oxide = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Live share: each session's traffic is encrypted with the secret in its invite code
# (pure Rust; no TLS stack or certificates needed between two PCs).
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
getrandom = "0.2"
# Live share: an IPv6-only listener next to the IPv4 one (Linux sockets are dual-stack by default).
socket2 = "0.6"
# In-window preview (WebView2). Off by default: on the GNU toolchain it links
# WebView2Loader.dll at load time, which must then ship next to the exe.
gpui-webview = { version = "=0.9.0", optional = true }
wry = { version = "0.53.3", package = "lb-wry", optional = true }

[features]
default = ["fast"]
embedded-preview = ["dep:gpui-webview", "dep:wry"]
# GPUI Fast (github.com/longbridge/gpui-fast): retained mode reuses unchanged
# views, layout and text between frames instead of rebuilding them. Measured on
# FluxCode (see README): idle CPU about halved, scrolling and memory about the
# same, +1 MB exe. Build without it: `cargo build --release --no-default-features`.
fast = ["gpui-kit/gpui-fast"]

# Small and fast.
# Debug builds: line numbers for FluxCode's own panics and backtraces, and no debug
# info for the dependencies (GPUI and the rest). Full debug info made the local build
# cache tens of gigabytes; nobody steps through GPUI's internals.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# GPUI's Windows renderer with two memory changes (vendor/gpui-fast-windows/FLUXCODE.md):
# path textures made only while frames draw paths, and two swap-chain buffers.
[patch.crates-io]
gpui-fast-windows = { path = "vendor/gpui-fast-windows" }
