[package]
name = "fluxcode-gpui"
version = "0.9.1-dev.2026-11-09-1655"
description = "FluxCode - native GPUI edition (no WebView)"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "fluxcode-gpui"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
# Syntax colors from syntect with bat's grammar set: about 200 languages in a few MB,
# where tree-sitter needs a compiled grammar (often 1-3 MB) per language.
gpui-kit = { version = "=0.9.0", default-features = false, features = ["component", "assets", "syntect"] }
anyhow = "1"
futures = "0.3"
lsp-types = { version = "0.97", features = ["proposed"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only to read an image's width/height for the image tab; gpui already builds this
# crate with its decoders, so no new code is compiled.
image = { version = "0.25", default-features = false }
# Agent memory (AoC Memory port): ids are SHA-1 prefixes, times ISO 8601, as in
# ant_memory.py. Both crates are already compiled for gpui.
sha1_smol = "1"
# Attachments: images as base64, Word/Excel/PowerPoint text from their ZIP (already compiled for gpui).
base64 = "0.22"
miniz_oxide = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# In-window preview (WebView2). Off by default: on the GNU toolchain it links
# WebView2Loader.dll at load time, which must then ship next to the exe.
gpui-webview = { version = "=0.9.0", optional = true }
wry = { version = "0.53.3", package = "lb-wry", optional = true }

[features]
default = ["fast"]
embedded-preview = ["dep:gpui-webview", "dep:wry"]
# GPUI Fast (github.com/longbridge/gpui-fast): retained mode reuses unchanged
# views, layout and text between frames instead of rebuilding them. Measured on
# FluxCode (see README): idle CPU about halved, scrolling and memory about the
# same, +1 MB exe. Build without it: `cargo build --release --no-default-features`.
fast = ["gpui-kit/gpui-fast"]

# Same release profile as the Tauri app: small and fast.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
