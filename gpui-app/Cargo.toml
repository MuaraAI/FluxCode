[package]
name = "fluxcode-gpui"
version = "0.6.0-dev.2026-11-07-1935"
description = "FluxCode - native GPUI edition (no WebView)"
edition = "2021"
license-file = "../LICENSE"
publish = false

[[bin]]
name = "fluxcode-gpui"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
gpui-kit = { version = "=0.9.0", default-features = false, features = [
    "component", "assets",
    "tree-sitter-javascript", "tree-sitter-typescript", "tree-sitter-tsx",
    "tree-sitter-html", "tree-sitter-css", "tree-sitter-markdown", "tree-sitter-markdown-inline",
    "tree-sitter-python", "tree-sitter-rust", "tree-sitter-php", "tree-sitter-toml",
    "tree-sitter-yaml", "tree-sitter-bash", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-go",
    "tree-sitter-java", "tree-sitter-lua", "tree-sitter-sql",
] }
anyhow = "1"
futures = "0.3"
lsp-types = { version = "0.97", features = ["proposed"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# In-window preview (WebView2). Off by default: on the GNU toolchain it links
# WebView2Loader.dll at load time, which must then ship next to the exe.
gpui-webview = { version = "=0.9.0", optional = true }
wry = { version = "0.53.3", package = "lb-wry", optional = true }

[features]
embedded-preview = ["dep:gpui-webview", "dep:wry"]

# Same release profile as the Tauri app: small and fast.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
