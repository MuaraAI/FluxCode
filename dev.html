<!doctype html>
<!-- Browser-only preview of the FluxCode UI with a mocked Tauri backend.
     Run `npm run dev` and open http://localhost:1420/dev.html. Not part of the app build. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FluxCode (UI preview)</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <script type="module">
      await import("/src/dev-mock.js");
      const html = await (await fetch("/index.html")).text();
      const body = new DOMParser().parseFromString(html, "text/html").body;
      body.querySelectorAll("script").forEach((s) => s.remove());
      document.body.replaceChildren(...body.childNodes);
      await import("/src/main.js");
    </script>
  </body>
</html>
