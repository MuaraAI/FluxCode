name: Idea
description: Something FluxCode could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task, and where FluxCode gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it working. Screenshots from other editors are welcome.
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build
      description: Optional. Help > About FluxCode copies it to the clipboard.
      placeholder: BuildDev-2026-11-09-17-30-12
