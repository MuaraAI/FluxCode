# Turns the results of "Pull request check" into one comment and the "PR verdict"
# check on the pull request.
#
# Runs on workflow_run, so it is main's copy of this file and of pr_report.py that
# runs, with a token that can comment. The artifact it reads was made by the pull
# request's code: it is unpacked as data, its PR number is checked against the commit
# GitHub says the run was for, and pr_report.py escapes every string in it. Nothing
# from the artifact is run.

name: Pull request report

on:
  workflow_run:
    workflows: ["Pull request check"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  report:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the results
        id: dl
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const arts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, { owner, repo, run_id: run.id, per_page: 100 });
            const art = arts.find((a) => a.name === 'pr-check-results');
            if (!art) { core.setOutput('found', 'false'); return; }
            const zip = await github.rest.actions.downloadArtifact({ owner, repo, artifact_id: art.id, archive_format: 'zip' });
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/results.zip`, Buffer.from(zip.data));
            core.setOutput('found', 'true');

      - name: Unpack (JSON files only)
        if: steps.dl.outputs.found == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          python3 -I - "$RUNNER_TEMP/results.zip" "$RUNNER_TEMP/results" <<'EOF'
          import os, sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          for info in z.infolist():
              name = os.path.basename(info.filename)
              if name.endswith(".json") and info.file_size < 5_000_000 and name in {
                      "quality.json", "perf.json", "deps.json", "jobs.json", "pr.json"}:
                  open(os.path.join(sys.argv[2], name), "wb").write(z.read(info))
          EOF
          ls -l "$RUNNER_TEMP/results"

      - name: Find the pull request
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            let number = null;
            try { number = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/results/pr.json`, 'utf8')).number; } catch (e) {}
            if (!Number.isInteger(number)) number = run.pull_requests?.[0]?.number ?? null;
            if (!Number.isInteger(number)) { core.info('no pull request number'); core.setOutput('number', ''); return; }
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            // The artifact says which pull request it is for; GitHub says which commit
            // the run built. Both must agree, or the artifact is lying.
            if (pr.head.sha !== run.head_sha) { core.info(`run is for ${run.head_sha}, PR #${number} is at ${pr.head.sha}: stale or forged, skipping`); core.setOutput('number', ''); return; }
            core.setOutput('number', String(number));

      - name: Report
        if: steps.pr.outputs.number != ''
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          python3 -I .github/scripts/pr_report.py --dir "$RUNNER_TEMP/results" --config .github/pr-check.json \
            --out-md "$RUNNER_TEMP/report.md" --out-json "$RUNNER_TEMP/verdict.json"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment and verdict
        if: steps.pr.outputs.number != ''
        uses: actions/github-script@v7
        env:
          PR: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const number = Number(process.env.PR);
            const report = fs.readFileSync(`${process.env.RUNNER_TEMP}/report.md`, 'utf8');
            const verdict = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/verdict.json`, 'utf8'));
            const marker = '<!-- fluxcode-pr-check -->';
            const body = `${marker}\n${report}\n<sub>[Run](${run.html_url}) for ${run.head_sha.slice(0, 7)}.</sub>`;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
            const mine = comments.find((c) => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            const title = verdict.conclusion === 'success'
              ? (verdict.warns.length ? `Passed with ${verdict.warns.length} note(s)` : 'Passed')
              : `${verdict.fails.length} problem(s)`;
            await github.rest.checks.create({
              owner, repo, name: 'PR verdict', head_sha: run.head_sha, status: 'completed',
              conclusion: verdict.conclusion, details_url: run.html_url,
              output: { title, summary: report.slice(0, 65000) },
            });
