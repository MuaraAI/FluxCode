# Development builds for Windows (NSIS installer) and Linux (.deb + .AppImage).
# Runs on every push to main, on pull requests and on manual dispatch; the
# installers are attached to the run as artifacts named "...-dev".

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            bundles: nsis
            artifact: src-tauri/target/release/bundle/nsis/*.exe
          - name: linux
            os: ubuntu-22.04
            bundles: deb,appimage
            artifact: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
    env:
      # Overrides the Windows-only target-dir in src-tauri/.cargo/config.toml.
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux build dependencies (WebKitGTK)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev

      - run: npm ci

      - name: Build (${{ matrix.bundles }})
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Version
        id: version
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: FluxCode-${{ steps.version.outputs.v }}-${{ matrix.name }}-dev
          path: ${{ matrix.artifact }}
          if-no-files-found: error
