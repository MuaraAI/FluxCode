# Builds FluxCode for Windows, Linux and macOS. On main, every push becomes a release
# tagged BuildDev-YYYY-MM-DD-HH-MM-SS (Asia/Jakarta time); installed copies of
# FluxCode find it on their own. Pull requests only build and test.

name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE", ".github/ISSUE_TEMPLATE/**", ".github/workflows/issue-*.yml", ".github/workflows/pr-*.yml", ".github/scripts/**", ".github/pr-check.json", ".github/CODEOWNERS"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE", ".github/ISSUE_TEMPLATE/**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Pull requests check that FluxCode builds, passes its tests, installs and starts, with
# the quick debug build (it shares its compiled crates with the tests, so everything is
# compiled once). Only main makes the optimized build people download: its whole-program
# link is what takes the time, and it only pays off for a release.
env:
  FAST: ${{ github.event_name == 'pull_request' }}

jobs:
  stamp:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.s.outputs.build }}
    steps:
      - id: s
        run: echo "build=$(TZ=Asia/Jakarta date +BuildDev-%Y-%m-%d-%H-%M-%S)" >> "$GITHUB_OUTPUT"

  windows:
    needs: stamp
    runs-on: windows-latest
    env:
      FLUXCODE_BUILD: ${{ needs.stamp.outputs.build }}
      # Baked into release binaries so they can talk to the MuaraAI relay.
      # GitHub withholds secrets from forks, so a forked PR exposes nothing and
      # falls back to bore.pub. A PR from a branch in this repo does get the
      # secret: keep untrusted code off same-repo branches or rotate after.
      FLUXCODE_RELAY_SECRET: ${{ secrets.FLUXCODE_RELAY_SECRET }}
    steps:
      # Full history and tags: build.rs names the build each release came in.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ env.FAST == 'true' && 'dev' || 'release' }}
      - name: Build
        shell: pwsh
        run: |
          if ($env:FAST -eq 'true') { cargo build; $bin = 'target/debug/fluxcode.exe' } else { cargo build --release; $bin = 'target/release/fluxcode.exe' }
          Copy-Item $bin target/fluxcode.exe
          "{0:N1} MB  fluxcode.exe" -f ((Get-Item target/fluxcode.exe).Length / 1MB)
      - name: Pack
        shell: pwsh
        run: |
          $name = "FluxCode-$env:FLUXCODE_BUILD-windows-x64"
          New-Item -ItemType Directory "dist/$name" | Out-Null
          Copy-Item target/fluxcode.exe "dist/$name/FluxCode.exe"
          Copy-Item packaging/windows/install.ps1, packaging/windows/Install.cmd, packaging/windows/README.txt "dist/$name"
          # Plain Deflate (what the built-in updater reads), from 7-Zip's best encoder:
          # smaller than Compress-Archive's, readable by every unzip.
          $sevenzip = "$env:ProgramFiles\7-Zip\7z.exe"
          if (Test-Path $sevenzip) {
            & $sevenzip a -tzip -mm=Deflate -mx=9 -mfb=258 -mpass=15 "dist/$name.zip" "./dist/$name/*" | Out-Null
            if ($LASTEXITCODE) { throw "7z failed" }
          } else {
            Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip" -CompressionLevel Optimal
          }
          # The update file: the exe alone, xz (installed copies update from it).
          python packaging/xz.py target/fluxcode.exe "dist/FluxCode-$env:FLUXCODE_BUILD-windows-x64.update.xz"
          if ($LASTEXITCODE) { throw "xz failed" }
          Get-ChildItem dist/*.zip, dist/*.xz | ForEach-Object { "{0:N2} MB  {1}" -f ($_.Length / 1MB), $_.Name }
      # One .exe that installs for the user (packaging/windows/installer.nsi). The ZIP
      # stays: installed copies update themselves from it.
      - name: Installer
        shell: pwsh
        run: |
          $mk = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $mk)) { choco install nsis -y --no-progress | Out-Null }
          $exe = (Resolve-Path target/fluxcode.exe).Path
          $out = Join-Path (Resolve-Path dist).Path "FluxCode-$env:FLUXCODE_BUILD-windows-x64-setup.exe"
          & $mk /V2 "/DBUILD=$env:FLUXCODE_BUILD" "/DEXE=$exe" "/DOUT=$out" packaging/windows/installer.nsi
          if ($LASTEXITCODE) { throw "makensis failed" }
          "{0:N2} MB  {1}" -f ((Get-Item $out).Length / 1MB), (Split-Path $out -Leaf)
      # Install, start, uninstall on the runner: the installer is only published if it works.
      - name: Test the installer
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist/*-setup.exe).FullName
          Start-Process $setup -ArgumentList "/S" -Wait
          $app = "$env:USERPROFILE\.fluxcode\app"
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\FluxCode.lnk"
          foreach ($f in "$app\FluxCode.exe", "$app\Uninstall.exe", $lnk) { if (-not (Test-Path $f)) { throw "missing after install: $f" } }
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\FluxCode"
          $ver = (Get-ItemProperty $key).DisplayVersion
          if ($ver -ne $env:FLUXCODE_BUILD) { throw "Settings > Apps would show $ver" }
          # The installed exe runs: a command-line mode that writes a file and exits.
          $md = Join-Path $env:RUNNER_TEMP "readme.md"
          Start-Process "$app\FluxCode.exe" -ArgumentList "--flux-to-md", "README.flux", "`"$md`"" -Wait
          if (-not (Test-Path $md)) { throw "the installed FluxCode.exe did not run" }
          Start-Process "$app\Uninstall.exe" -ArgumentList "/S" -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path "$app\FluxCode.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$app\FluxCode.exe") { throw "uninstall left FluxCode.exe" }
          if (Test-Path $lnk) { throw "uninstall left the Start Menu shortcut" }
          if (Test-Path $key) { throw "uninstall left the Settings > Apps entry" }
          "installer: install, run and uninstall all worked"
      - uses: actions/upload-artifact@v4
        if: env.FAST != 'true'
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.xz
            dist/*-setup.exe
          if-no-files-found: error

  linux:
    needs: stamp
    # The oldest supported runner, so the binary runs on glibc 2.35 and newer.
    runs-on: ubuntu-22.04
    env:
      FLUXCODE_BUILD: ${{ needs.stamp.outputs.build }}
      # Same reasoning as the windows job above.
      FLUXCODE_RELAY_SECRET: ${{ secrets.FLUXCODE_RELAY_SECRET }}
    steps:
      # Full history and tags: build.rs names the build each release came in.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: System libraries for GPUI
        run: |
          packages="pkg-config clang libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
                    libx11-xcb-dev libxcb1-dev libfontconfig1-dev libfreetype6-dev
                    libvulkan-dev libssl-dev libzstd-dev"
          # The runner's resolver sometimes fails on the Ubuntu mirrors
          # (azure.archive.ubuntu.com and friends) while Microsoft's repo resolves
          # fine, which fails this step before a single line is compiled. Retry, and
          # if that does not take, point the runner at public resolvers and retry
          # again, so a flaky DNS server costs a minute instead of the whole job.
          apt_install() {
            sudo apt-get update -qq &&
              sudo apt-get install -y --no-install-recommends $packages
          }
          apt_install ||
            { sleep 10; apt_install; } ||
            {
              echo "apt cannot reach the mirrors; using 1.1.1.1 and 8.8.8.8" >&2
              printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/resolv.conf >/dev/null
              sleep 5
              apt_install
            }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ env.FAST == 'true' && 'dev' || 'release' }}
      - name: Test
        run: cargo test --bin fluxcode
      - name: Build
        run: |
          if [ "$FAST" = true ]; then cargo build; bin=target/debug/fluxcode; else cargo build --release; bin=target/release/fluxcode; fi
          cp "$bin" target/fluxcode-bin
          ls -lh target/fluxcode-bin
      - name: Pack
        run: |
          name="FluxCode-$FLUXCODE_BUILD-linux-x64"
          mkdir -p "dist/$name"
          install -m 755 target/fluxcode-bin "dist/$name/fluxcode"
          install -m 755 packaging/linux/install.sh "dist/$name/install.sh"
          install -m 644 packaging/linux/fluxcode.desktop packaging/linux/README.txt "dist/$name/"
          install -m 644 assets/icon.png "dist/$name/fluxcode.png"
          # gzip at its strongest (the updater runs `tar -xzf`, any level reads the same).
          tar -cf - -C dist "$name" | gzip -9n > "dist/$name.tar.gz"
          python3 packaging/xz.py target/fluxcode-bin "dist/$name.update.xz"
          ls -lh dist/*.tar.gz dist/*.xz
      - uses: actions/upload-artifact@v4
        if: env.FAST != 'true'
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.xz
          if-no-files-found: error

  macos:
    needs: stamp
    # Apple silicon runner; the Intel half is cross-compiled and the two are joined into
    # one universal binary.
    runs-on: macos-latest
    env:
      FLUXCODE_BUILD: ${{ needs.stamp.outputs.build }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      # Full history and tags: build.rs names the build each release came in.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ env.FAST == 'true' && 'dev-macos' || 'release-macos' }}
      - name: Test
        run: cargo test --bin fluxcode
      # A pull request packs the Apple silicon debug build only (the runner's own);
      # main joins both optimized halves into one universal binary.
      - name: Build
        run: |
          if [ "$FAST" = true ]; then
            cargo build
            cp target/debug/fluxcode target/fluxcode-universal
          else
            cargo build --release --target aarch64-apple-darwin
            cargo build --release --target x86_64-apple-darwin
            lipo -create -output target/fluxcode-universal \
              target/aarch64-apple-darwin/release/fluxcode target/x86_64-apple-darwin/release/fluxcode
          fi
          lipo -info target/fluxcode-universal
          ls -lh target/fluxcode-universal
      - name: Pack
        run: |
          sh packaging/macos/bundle.sh "$FLUXCODE_BUILD" target/fluxcode-universal dist
          python3 packaging/xz.py target/fluxcode-universal "dist/FluxCode-$FLUXCODE_BUILD-macos-universal.update.xz"
          ls -lh dist
      # Open the packed app like a user would, and keep a screenshot of its window.
      - name: Test the app
        run: |
          mkdir -p "$RUNNER_TEMP/app" shots
          tar -xzf dist/*-macos-universal.tar.gz -C "$RUNNER_TEMP/app"
          app=$(ls -d "$RUNNER_TEMP"/app/*/FluxCode.app)
          codesign --verify --verbose=2 "$app"
          "$app/Contents/MacOS/fluxcode" --flux-to-md README.flux "$RUNNER_TEMP/readme.md"
          test -s "$RUNNER_TEMP/readme.md"
          open -n "$app"
          sleep 15
          pgrep -x fluxcode >/dev/null || { echo "FluxCode quit right after it opened"; exit 1; }
          screencapture -x shots/macos.png || true
          pkill -x fluxcode || true
          echo "app: opened and still running after 15 s"
      - uses: actions/upload-artifact@v4
        if: env.FAST != 'true'
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/*.tar.gz
            dist/*.xz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-screenshot
          path: shots/
          if-no-files-found: ignore

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [stamp, windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUILD: ${{ needs.stamp.outputs.build }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes
        run: |
          prev=$(git tag -l 'BuildDev-*' | sort | tail -n 1)
          # The macOS screenshot is a CI artifact, not a release file.
          rm -f dist/*.png
          setup=$(cd dist && ls *windows-x64-setup.exe)
          win=$(cd dist && ls *windows-x64.zip)
          lin=$(cd dist && ls *linux-x64.tar.gz)
          mac=$(cd dist && ls *macos-universal.dmg)
          {
            echo "Development build of FluxCode, made from \`${GITHUB_SHA::7}\`."
            echo
            echo "## What changed"
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --format='- %s' "$prev..HEAD"
              echo
              echo "Compared with [$prev](https://github.com/$GITHUB_REPOSITORY/compare/$prev...$BUILD). Every build: [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md)."
            else
              awk '/^## /{n++; if (n==1) next} n==1' CHANGELOG.md
            fi
            echo
            echo "## Download"
            echo
            echo "| System | File | Install |"
            echo "| --- | --- | --- |"
            echo "| Windows 10/11, x64 | \`$setup\` | Run it (no admin needed) |"
            echo "| macOS 11+, Apple silicon and Intel | \`$mac\` | Open it, drag FluxCode to Applications; the first open asks once (Privacy & Security > Open Anyway) |"
            echo "| Linux, x64 (glibc 2.35+) | \`$lin\` | Extract, run \`./install.sh\` |"
            echo "| Windows, portable | \`$win\` | Extract; \`FluxCode.exe\` runs from the folder, \`Install.cmd\` installs it |"
            echo
            echo "Already installed? FluxCode offers this build in the bottom-right corner and updates itself."
          } > notes.md
          cat notes.md
      - name: Publish
        run: |
          gh release create "$BUILD" dist/* \
            --target "$GITHUB_SHA" \
            --title "FluxCode $BUILD" \
            --notes-file notes.md \
            --latest
