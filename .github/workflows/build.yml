# Builds FluxCode for Windows and Linux. On main, every push becomes a release
# tagged BuildDev-YYYY-MM-DD-HH-MM-SS (Asia/Jakarta time); installed copies of
# FluxCode find it on their own. Pull requests only build and test.

name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE", ".github/ISSUE_TEMPLATE/**", ".github/workflows/issue-*.yml", ".github/workflows/pr-*.yml"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE", ".github/ISSUE_TEMPLATE/**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  stamp:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.s.outputs.build }}
    steps:
      - id: s
        run: echo "build=$(TZ=Asia/Jakarta date +BuildDev-%Y-%m-%d-%H-%M-%S)" >> "$GITHUB_OUTPUT"

  windows:
    needs: stamp
    runs-on: windows-latest
    env:
      FLUXCODE_BUILD: ${{ needs.stamp.outputs.build }}
      # Baked into release binaries so they can talk to the MuaraAI relay.
      # GitHub withholds secrets from forks, so a forked PR exposes nothing and
      # falls back to bore.pub. A PR from a branch in this repo does get the
      # secret: keep untrusted code off same-repo branches or rotate after.
      FLUXCODE_RELAY_SECRET: ${{ secrets.FLUXCODE_RELAY_SECRET }}
    steps:
      # Full history and tags: build.rs names the build each release came in.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - name: Build
        run: cargo build --release
      - name: Pack
        shell: pwsh
        run: |
          $name = "FluxCode-$env:FLUXCODE_BUILD-windows-x64"
          New-Item -ItemType Directory "dist/$name" | Out-Null
          Copy-Item target/release/fluxcode.exe "dist/$name/FluxCode.exe"
          Copy-Item packaging/windows/install.ps1, packaging/windows/Install.cmd, packaging/windows/README.txt "dist/$name"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  linux:
    needs: stamp
    # The oldest supported runner, so the binary runs on glibc 2.35 and newer.
    runs-on: ubuntu-22.04
    env:
      FLUXCODE_BUILD: ${{ needs.stamp.outputs.build }}
      # Same reasoning as the windows job above.
      FLUXCODE_RELAY_SECRET: ${{ secrets.FLUXCODE_RELAY_SECRET }}
    steps:
      # Full history and tags: build.rs names the build each release came in.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: System libraries for GPUI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig1-dev libfreetype6-dev \
            libvulkan-dev libssl-dev libzstd-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - name: Test
        run: cargo test --bin fluxcode
      - name: Build
        run: cargo build --release
      - name: Pack
        run: |
          name="FluxCode-$FLUXCODE_BUILD-linux-x64"
          mkdir -p "dist/$name"
          install -m 755 target/release/fluxcode "dist/$name/fluxcode"
          install -m 755 packaging/linux/install.sh "dist/$name/install.sh"
          install -m 644 packaging/linux/fluxcode.desktop packaging/linux/README.txt "dist/$name/"
          install -m 644 assets/icon.png "dist/$name/fluxcode.png"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [stamp, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUILD: ${{ needs.stamp.outputs.build }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes
        run: |
          prev=$(git tag -l 'BuildDev-*' | sort | tail -n 1)
          win=$(cd dist && ls *windows-x64.zip)
          lin=$(cd dist && ls *linux-x64.tar.gz)
          {
            echo "Development build of FluxCode, made from \`${GITHUB_SHA::7}\`."
            echo
            echo "## What changed"
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --format='- %s' "$prev..HEAD"
              echo
              echo "Compared with [$prev](https://github.com/$GITHUB_REPOSITORY/compare/$prev...$BUILD). Every build: [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md)."
            else
              awk '/^## /{n++; if (n==1) next} n==1' CHANGELOG.md
            fi
            echo
            echo "## Download"
            echo
            echo "| System | File | Install |"
            echo "| --- | --- | --- |"
            echo "| Windows 10/11, x64 | \`$win\` | Extract, double-click \`Install.cmd\` |"
            echo "| Linux, x64 (glibc 2.35+) | \`$lin\` | Extract, run \`./install.sh\` |"
            echo
            echo "Already installed? FluxCode offers this build in the bottom-right corner and updates itself."
          } > notes.md
          cat notes.md
      - name: Publish
        run: |
          gh release create "$BUILD" dist/* \
            --target "$GITHUB_SHA" \
            --title "FluxCode $BUILD" \
            --notes-file notes.md \
            --latest
