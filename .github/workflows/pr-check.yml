# Measures a pull request against main: code quality of the added lines, performance
# (size, time, memory) of the same build of both sides, and new security advisories in
# dependencies. Build and tests for every platform stay in build.yml.
#
# This workflow builds the pull request's code, so it runs with a read-only token and
# no secrets (GitHub withholds both from forks; first-time contributors also wait for a
# maintainer to approve the run). It does not judge: it uploads raw numbers, and
# pr-report.yml (which runs from main) turns them into the comment and the
# "PR verdict" check with main's limits. The scripts it runs are main's copies too
# (the base/ worktree), so a pull request cannot grade itself by editing them.

name: Pull request check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  # Same build ID on both sides, so build.rs embeds the same string.
  FLUXCODE_BUILD: BuildDev-2000-01-01-00-00-00

jobs:
  quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Base worktree (main's scripts and limits)
        run: |
          git -C pr worktree add --detach ../base HEAD^1
          # The first pull request that adds these scripts has none on main yet.
          if [ -f base/.github/scripts/pr_quality.py ]; then echo "TRUSTED=$PWD/base/.github" >> "$GITHUB_ENV"
          else echo "TRUSTED=$PWD/pr/.github" >> "$GITHUB_ENV"; fi
      - name: System libraries for GPUI
        run: |
          packages="pkg-config clang libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
                    libx11-xcb-dev libxcb1-dev libfontconfig1-dev libfreetype6-dev
                    libvulkan-dev libssl-dev libzstd-dev"
          apt_install() { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends $packages; }
          apt_install || { sleep 10; apt_install; } || {
            printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/resolv.conf >/dev/null
            sleep 5; apt_install; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pr
          shared-key: pr-clippy
      - name: Clippy
        working-directory: pr
        run: |
          set +e
          cargo clippy --bin fluxcode --message-format=json -- -W clippy::all > "$RUNNER_TEMP/clippy.json"
          echo "clippy exit: $?"
      - name: Grade the added lines
        run: |
          mkdir -p out
          python3 -I "$TRUSTED/scripts/pr_quality.py" --repo pr --base HEAD^1 --clippy "$RUNNER_TEMP/clippy.json" \
            --config "$TRUSTED/pr-check.json" --out out/quality.json
          python3 -I -c "import json,sys; d=json.load(open('out/quality.json')); sys.exit(1 if d['compile_error'] else 0)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality
          path: out/quality.json
          if-no-files-found: ignore

  perf:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      # The release profile without whole-program LTO: the same for both sides, and
      # about four times faster to build. Sizes and times are compared, not published.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
        with:
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Base worktree
        run: |
          git -C pr worktree add --detach ../base HEAD^1
          if [ -f base/.github/scripts/pr_perf.py ]; then echo "TRUSTED=$PWD/base/.github" >> "$GITHUB_ENV"
          else echo "TRUSTED=$PWD/pr/.github" >> "$GITHUB_ENV"; fi
      - name: System libraries for GPUI
        run: |
          packages="pkg-config clang libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
                    libx11-xcb-dev libxcb1-dev libfontconfig1-dev libfreetype6-dev
                    libvulkan-dev libssl-dev libzstd-dev"
          apt_install() { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends $packages; }
          apt_install || { sleep 10; apt_install; } || {
            printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/resolv.conf >/dev/null
            sleep 5; apt_install; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pr -> ../target
          shared-key: pr-perf
      # Both sides are built in ONE folder, switched with git: cargo decides what to
      # rebuild from file times at a path, so building base/ and pr/ into a shared
      # target would hand back main's binary for the pull request.
      - name: Build main
        run: |
          git -C pr worktree add --detach ../build HEAD^1
          cargo build --release --locked --manifest-path build/Cargo.toml --bin fluxcode
          cp target/release/fluxcode "$RUNNER_TEMP/fluxcode-base"
      - name: Build the pull request
        run: |
          git -C build checkout --quiet --detach "$(git -C pr rev-parse HEAD)"
          cargo build --release --manifest-path build/Cargo.toml --bin fluxcode
          cp target/release/fluxcode "$RUNNER_TEMP/fluxcode-head"
          strip "$RUNNER_TEMP/fluxcode-base" "$RUNNER_TEMP/fluxcode-head"
          if cmp -s "$RUNNER_TEMP/fluxcode-base" "$RUNNER_TEMP/fluxcode-head"; then
            echo "the two binaries are identical"
            if ! git -C pr diff --quiet HEAD^1 HEAD -- src build.rs Cargo.toml Cargo.lock vendor; then
              echo "::error::the code changed but the binary did not: the pull request was not rebuilt"; exit 1
            fi
          fi
      - name: Measure
        run: |
          mkdir -p out
          python3 -I "$TRUSTED/scripts/pr_perf.py" --base-bin "$RUNNER_TEMP/fluxcode-base" --head-bin "$RUNNER_TEMP/fluxcode-head" \
            --base-dir base --head-dir pr --runs 40 --out out/perf.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf
          path: out/perf.json
          if-no-files-found: ignore

  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Base worktree
        run: |
          git -C pr worktree add --detach ../base HEAD^1
          if [ -f base/.github/scripts/pr_deps.py ]; then echo "TRUSTED=$PWD/base/.github" >> "$GITHUB_ENV"
          else echo "TRUSTED=$PWD/pr/.github" >> "$GITHUB_ENV"; fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: New advisories
        run: |
          mkdir -p out
          python3 -I "$TRUSTED/scripts/pr_deps.py" --base-dir base --head-dir pr --out out/deps.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deps
          path: out/deps.json
          if-no-files-found: ignore

  # Hands everything to pr-report.yml in one artifact, with which jobs finished.
  collect:
    if: always()
    needs: [quality, perf, deps]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: results
          merge-multiple: true
      - name: Job results
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          QUALITY: ${{ needs.quality.result }}
          PERF: ${{ needs.perf.result }}
          DEPS: ${{ needs.deps.result }}
        run: |
          printf '{"quality":"%s","perf":"%s","deps":"%s"}\n' "$QUALITY" "$PERF" "$DEPS" > results/jobs.json
          printf '{"number":%d,"head_sha":"%s"}\n' "$PR" "$HEAD_SHA" > results/pr.json
          ls -l results
      - uses: actions/upload-artifact@v4
        with:
          name: pr-check-results
          path: results/
